<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Weather Report</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <h1 class="site-header__title">Alpha Weather Report</h1>
        <div class="site-header__controls">
          <button
            id="unit-toggle"
            class="toggle-pill"
            type="button"
            aria-pressed="false"
            aria-label="Switch to Fahrenheit"
          >
            <span aria-hidden="true">°C</span>
          </button>
          <button
            id="theme-toggle"
            class="toggle-pill"
            type="button"
            aria-pressed="false"
            aria-label="Switch to dark mode"
          >
            <span aria-hidden="true">&#9789;</span>
          </button>
        </div>
      </header>

      <div class="horizon-divider" aria-hidden="true"></div>

      <main class="main">
        <section class="search-section" aria-label="City search">
          <form id="search-form" class="search-form" autocomplete="off">
            <div class="search-form__field">
              <label for="search-input" class="visually-hidden">
                Search for a city
              </label>
              <input
                id="search-input"
                type="text"
                name="city"
                placeholder="Search for a city…"
                class="search-form__input"
              />
              <ul
                id="autocomplete-list"
                class="autocomplete-list"
                role="listbox"
                hidden
              ></ul>
            </div>
            <button type="submit" class="search-form__button">Search</button>
          </form>

          <div id="recent-chips" class="recent-chips" hidden></div>

          <p id="inline-error" class="inline-error" role="alert" hidden></p>
        </section>

        <div
          id="spinner"
          class="spinner"
          role="status"
          aria-live="polite"
          hidden
        >
          <span class="visually-hidden">Loading weather…</span>
        </div>

        <section
          id="current-weather"
          class="weather-card"
          aria-label="Current weather"
          hidden
        >
          <div class="weather-card__top">
            <div>
              <h2 id="weather-city" class="weather-card__city"></h2>
              <p id="weather-time" class="weather-card__time"></p>
            </div>
            <img id="weather-icon" class="weather-card__icon" alt="" />
          </div>

          <p id="weather-temp" class="weather-card__temp"></p>
          <p id="weather-condition" class="weather-card__condition"></p>

          <dl class="weather-card__stats">
            <div class="weather-card__stat">
              <dt>Humidity</dt>
              <dd id="weather-humidity"></dd>
            </div>
            <div class="weather-card__stat">
              <dt>Wind</dt>
              <dd id="weather-wind"></dd>
            </div>
          </dl>
        </section>

        <section
          id="forecast"
          class="forecast"
          aria-label="5-day forecast"
          hidden
        >
          <div id="forecast-cards" class="forecast__cards"></div>
        </section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
